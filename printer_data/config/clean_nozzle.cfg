[gcode_macro CLEAN_NOZZLE_PARK]
gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}

  G90
  G1 X300 Y348 Z6 F6000

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 300
variable_start_y: 348
variable_start_z: 4
variable_wipe_dist: -35
variable_wipe_qty: 10
variable_wipe_spd: 200
variable_raise_distance: 20

gcode:
  {% set hotendtemp = params.extruder|int %}
  {% if (printer.gcode_move.position.z ) < 35 %}
    G1 Z35 F900
  {% else %}
    G91
    G1 Z5 F900 
    G90
  {% endif %}

  M109 S{hotendtemp}

  G92 E0
  G1 E80 F400
  M106 S255
  M400
  M106 P2 S0
  M104 S0
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp-20}

  {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
  {% endif %}
  
  G90                                            ; absolute positioning
  ## Move nozzle to start position
  G1 X{start_x} Y{start_y} F6000
  G1 Z{start_z} F1500

  ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 X282 Z{raise_distance}

